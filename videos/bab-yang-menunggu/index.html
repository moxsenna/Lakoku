<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "DM Serif Display";
        src: url("assets/fonts/dmserif-400.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Plus Jakarta Sans";
        src: url("assets/fonts/jakarta-var.woff2") format("woff2");
        font-weight: 200 800;
        font-style: normal;
        font-display: block;
      }

      /* Palet dikutip dari app/globals.css (tema gelap) */
      :root {
        --ink: #191319;
        --plum: #3d1f3d;
        --rose: #c94967;
        --gold: #d5a45c;
        --cream: #fff7ee;
        --mauve: #e8dce8;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ink);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
        color: var(--cream);
        background: var(--ink);
      }

      .clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .serif {
        font-family: "DM Serif Display", Georgia, serif;
        font-weight: 400;
      }

      /* ===== Sampul + dim ===== */
      #cover-img {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1080px;
        object-fit: cover;
        will-change: transform;
      }
      #cover-dim {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1080px;
        background: var(--ink);
        opacity: 0;
      }

      /* ===== Headline bergantian (satu slot, tiga kalimat) ===== */
      #headline {
        position: absolute;
        left: 80px;
        top: 1140px;
        width: 920px;
        height: 190px;
        display: grid;
        place-items: center;
        text-align: center;
      }
      .line {
        grid-area: 1 / 1;
        font-size: 60px;
        line-height: 1.2;
        color: var(--cream);
      }
      #line-2,
      #line-3 {
        opacity: 0;
        visibility: hidden;
      }

      /* ===== Bilah progres ===== */
      #bar-label {
        position: absolute;
        left: 80px;
        top: 1358px;
        width: 920px;
        text-align: center;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--gold);
        opacity: 0;
        will-change: transform, opacity;
      }
      #bar-track {
        position: absolute;
        left: 80px;
        top: 1420px;
        width: 920px;
        height: 22px;
        border-radius: 12px;
        background: rgba(232, 220, 232, 0.16);
        opacity: 0;
        will-change: transform, opacity;
      }
      #bar-fill {
        position: absolute;
        left: 0;
        top: 0;
        width: 0;
        height: 100%;
        border-radius: 12px;
        background: var(--rose);
        will-change: width, opacity;
      }

      /* ===== Tombol pilihan redup ===== */
      .choice {
        position: absolute;
        left: 80px;
        width: 920px;
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 40px;
        border: 3px solid rgba(232, 220, 232, 0.28);
        border-radius: 30px;
        background: rgba(25, 19, 25, 0.85);
        font-size: 33px;
        font-weight: 700;
        color: var(--cream);
        opacity: 0;
        will-change: transform, opacity;
      }
      #choice-a {
        top: 1530px;
        border-color: var(--rose);
        background: rgba(201, 73, 103, 0.16);
      }
      #choice-b {
        top: 1650px;
      }
      .choice .arrow {
        color: var(--mauve);
        opacity: 0.7;
      }

      /* ===== Endcard ===== */
      #end-glow {
        position: absolute;
        left: 50%;
        top: 880px;
        width: 1300px;
        height: 1300px;
        margin-left: -650px;
        margin-top: -650px;
        background: radial-gradient(
          ellipse 50% 50% at 50% 50%,
          rgba(201, 73, 103, 0.34) 0%,
          rgba(201, 73, 103, 0) 66%
        );
      }
      #end-inner {
        position: absolute;
        left: 90px;
        width: 900px;
        top: 480px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      #end-logo {
        width: 200px;
        height: 200px;
        border-radius: 26%;
        border: 3px solid rgba(232, 220, 232, 0.2);
        object-fit: cover;
        transform-origin: 50% 50%;
        will-change: transform, opacity;
      }
      #end-word {
        margin-top: 34px;
        font-size: 76px;
        line-height: 1;
        color: var(--cream);
        will-change: transform, opacity;
      }
      #end-cta {
        margin-top: 64px;
        width: 760px;
        height: 124px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 36px;
        background: var(--rose);
        font-size: 42px;
        font-weight: 800;
        color: var(--cream);
        transform-origin: 50% 50%;
        will-change: transform, opacity;
      }
      #end-sub {
        margin-top: 30px;
        font-size: 30px;
        color: var(--mauve);
        opacity: 0.86;
        will-change: transform, opacity;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="13"
      data-width="1080"
      data-height="1920"
    >
      <!-- ============ BABAK 1-3 (0 - 9,8s) ============ -->
      <div id="scene-main" class="clip" data-start="0" data-duration="9.8" data-track-index="0">
        <img id="cover-img" src="assets/cover-selasa.jpg" alt="" data-layout-allow-overflow />
        <div id="cover-dim"></div>

        <div id="headline">
          <p class="line serif" id="line-1">Ceritamu berhenti di tengah.</p>
          <p class="line serif" id="line-2">Masih ada 38 bab yang belum kamu jalani.</p>
          <p class="line serif" id="line-3">Satu keputusan menunggu giliranmu.</p>
        </div>

        <div id="bar-label">Bab 12 dari 50</div>
        <div id="bar-track">
          <div id="bar-fill"></div>
        </div>

        <div class="choice" id="choice-a">
          <span>Tinggal dan dengarkan kebenarannya?</span>
          <span class="arrow">&#8594;</span>
        </div>
        <div class="choice" id="choice-b">
          <span>Pergi sebelum semuanya terlambat?</span>
          <span class="arrow">&#8594;</span>
        </div>
      </div>

      <!-- ============ ENDCARD (9,8 - 13s) ============ -->
      <div id="scene-end" class="clip" data-start="9.8" data-duration="3.2" data-track-index="0">
        <div id="end-glow" data-layout-allow-overflow></div>
        <div id="end-inner">
          <img id="end-logo" src="assets/logo-lakoku.png" alt="" />
          <div id="end-word" class="serif">Lakoku</div>
          <div id="end-cta">Lanjutkan Ceritaku</div>
          <p id="end-sub">Kalau ini ceritamu, apa yang akan kamu lakukan?</p>
        </div>
      </div>

      <!-- ============ AUDIO ============ -->
      <audio id="bgm" src="assets/audio/music-silent-descent.mp3" data-start="0" data-duration="13" data-media-start="60" data-track-index="10"></audio>
      <audio id="clock" src="assets/audio/clock-tick.mp3" data-start="0" data-duration="7.05" data-track-index="11"></audio>
      <audio id="sfx-bell" src="assets/audio/notif-bell.mp3" data-start="0.35" data-volume="0.3" data-track-index="12"></audio>
      <audio id="sfx-swap" src="assets/audio/whoosh-light-pop.mp3" data-start="3.15" data-duration="0.18" data-volume="0.3" data-track-index="13"></audio>
      <audio id="sfx-choices" src="assets/audio/whoosh-fast.mp3" data-start="7.15" data-volume="0.25" data-track-index="14"></audio>
      <audio id="sfx-end" src="assets/audio/whoosh-sparkle.mp3" data-start="9.85" data-duration="3.15" data-volume="0.4" data-track-index="15"></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      /* ==========================================================
         SAMPUL — meredup + push pelan
         ========================================================== */
      tl.fromTo("#cover-img", { scale: 1 }, { scale: 1.05, duration: 9.8, ease: "none" }, 0);
      tl.fromTo("#cover-dim", { opacity: 0 }, { opacity: 0.55, duration: 2.2, ease: "power1.inOut" }, 0);

      /* ==========================================================
         KALIMAT BERGANTIAN (satu slot, tiga kalimat)
         ========================================================== */
      tl.fromTo(
        "#line-1",
        { autoAlpha: 0, y: 34 },
        { autoAlpha: 1, y: 0, duration: 0.55, ease: "power3.out" },
        0.4,
      );
      tl.to("#line-1", { autoAlpha: 0, duration: 0.24, ease: "power2.in" }, 2.85);
      tl.fromTo(
        "#line-2",
        { autoAlpha: 0, y: 34 },
        { autoAlpha: 1, y: 0, duration: 0.55, ease: "power3.out" },
        3.15,
      );
      tl.to("#line-2", { autoAlpha: 0, duration: 0.24, ease: "power2.in" }, 6.72);
      tl.fromTo(
        "#line-3",
        { autoAlpha: 0, y: 34 },
        { autoAlpha: 1, y: 0, duration: 0.55, ease: "power3.out" },
        7.05,
      );

      /* ==========================================================
         BILAH PROGRES — mengisi lalu berhenti, kemudian berdenyut
         ========================================================== */
      tl.fromTo(
        "#bar-label",
        { autoAlpha: 0, y: 24 },
        { autoAlpha: 1, y: 0, duration: 0.5, ease: "power2.out" },
        1.2,
      );
      tl.fromTo(
        "#bar-track",
        { autoAlpha: 0 },
        { autoAlpha: 1, duration: 0.5, ease: "power2.out" },
        1.2,
      );
      // Isi menuju 24% (12 dari 50) lalu BERHENTI — itulah pesannya.
      tl.to("#bar-fill", { width: "24%", duration: 1.1, ease: "power2.inOut" }, 1.5);
      // Denyut halus pada bilah selama babak dua.
      tl.fromTo(
        "#bar-fill",
        { opacity: 1 },
        { opacity: 0.55, duration: 0.55, ease: "sine.inOut", repeat: 5, yoyo: true },
        3.4,
      );

      /* ==========================================================
         TOMBOL PILIHAN — muncul redup, satu bingkai rose
         ========================================================== */
      tl.fromTo(
        "#choice-a",
        { autoAlpha: 0, y: 40 },
        { autoAlpha: 0.9, y: 0, duration: 0.55, ease: "power3.out" },
        7.15,
      );
      tl.fromTo(
        "#choice-b",
        { autoAlpha: 0, y: 40 },
        { autoAlpha: 0.62, y: 0, duration: 0.55, ease: "power3.out" },
        7.32,
      );

      /* ==========================================================
         ENDCARD
         ========================================================== */
      tl.fromTo(
        "#end-logo",
        { autoAlpha: 0, scale: 0 },
        { autoAlpha: 1, scale: 1, duration: 0.55, ease: "power3.out" },
        9.9,
      );
      tl.fromTo(
        "#end-word",
        { autoAlpha: 0, y: 28 },
        { autoAlpha: 1, y: 0, duration: 0.5, ease: "power3.out" },
        10.15,
      );
      tl.fromTo(
        "#end-cta",
        { autoAlpha: 0, scale: 0.9 },
        { autoAlpha: 1, scale: 1, duration: 0.55, ease: "power3.out" },
        10.5,
      );
      tl.fromTo(
        "#end-sub",
        { autoAlpha: 0, y: 20 },
        { autoAlpha: 0.86, y: 0, duration: 0.45, ease: "power2.out" },
        10.9,
      );
      tl.fromTo(
        "#end-glow",
        { opacity: 0.4, scale: 0.92 },
        { opacity: 1, scale: 1.05, duration: 3.2, ease: "sine.inOut" },
        9.8,
      );

      /* ==========================================================
         AUDIO — fade volume (nilai absolut, tanpa data-volume)
         ========================================================== */
      tl.fromTo("#bgm", { volume: 0 }, { volume: 0.275, duration: 0.8, ease: "power1.out" }, 0);
      tl.fromTo(
        "#bgm",
        { volume: 0.275 },
        { volume: 0, duration: 1.4, ease: "power1.in", immediateRender: false },
        11.6,
      );
      tl.fromTo("#clock", { volume: 0 }, { volume: 0.16, duration: 0.5, ease: "power1.out" }, 0);
      tl.fromTo(
        "#clock",
        { volume: 0.16 },
        { volume: 0, duration: 0.15, ease: "power1.in", immediateRender: false },
        6.9,
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
